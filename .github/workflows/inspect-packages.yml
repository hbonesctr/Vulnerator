name: Inspect packages (temporary)
on:
  push:
    branches: [ "v2/sqlite2" ]
    paths: [ ".github/workflows/inspect-packages.yml" ]
jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - uses: NuGet/setup-nuget@v2
      - name: Show package build files and native library names
        shell: pwsh
        run: |
          nuget install System.Data.SQLite.EF6 -OutputDirectory pk -NonInteractive | Out-Null
          nuget install System.Data.SQLite -Version 2.0.4 -OutputDirectory pk -NonInteractive | Out-Null
          nuget install SourceGear.sqlite3 -OutputDirectory pk -NonInteractive | Out-Null
          $root = (Resolve-Path pk).Path
          foreach ($t in Get-ChildItem pk -Recurse -Include *.targets, *.props | Where-Object { $_.FullName -match 'SourceGear|SQLite' }) {
            $text = ((Get-Content $t.FullName -Raw) -replace '\s+', ' ')
            for ($i = 0; $i -lt $text.Length; $i += 2500) { Write-Host ('::notice::' + $t.FullName.Substring($root.Length + 1) + ' [' + $i + '] ' + $text.Substring($i, [Math]::Min(2500, $text.Length - $i))) }
          }
          foreach ($n in Get-ChildItem pk -Recurse -Filter *.nuspec | Where-Object { $_.Name -match 'SQLite|sqlite3' }) {
            $x = [xml](Get-Content $n.FullName)
            $groups = @($x.package.metadata.dependencies.group) | ForEach-Object { $_.targetFramework + '=' + ((@($_.dependency) | ForEach-Object { $_.id + ' ' + $_.version }) -join ',') }
            Write-Host ('::notice::nuspec ' + $n.Name + ' ' + $x.package.metadata.version + ' deps: ' + ($groups -join ' / '))
          }
          foreach ($d in Get-ChildItem pk -Recurse -Include 'System.Data.SQLite.dll', 'System.Data.SQLite.EF6.dll' | Where-Object { $_.FullName -match 'net471' }) {
            $bytes = [IO.File]::ReadAllBytes($d.FullName)
            $ascii = [Text.Encoding]::ASCII.GetString($bytes)
            $uni = [Text.Encoding]::Unicode.GetString($bytes)
            $names = @('e_sqlite3', 'sqlite3', 'SQLite.Interop', 'winsqlite3') | Where-Object { $ascii.Contains($_) -or $uni.Contains($_) }
            $ticks = @('DateTimeFormat', 'Ticks', 'datetimeformat') | Where-Object { $ascii.Contains($_) -or $uni.Contains($_) }
            Write-Host ('::notice::' + $d.FullName.Substring($root.Length + 1) + ' asm ' + [Reflection.AssemblyName]::GetAssemblyName($d.FullName).Version + ' file ' + $d.VersionInfo.FileVersion + ' natives: ' + ($names -join ',') + ' tickstrings: ' + ($ticks -join ','))
          }
          foreach ($d in Get-ChildItem pk -Recurse -Filter e_sqlite3.dll) { Write-Host ('::notice::' + $d.FullName.Substring($root.Length + 1) + ' ' + $d.VersionInfo.ProductVersion + ' ' + $d.Length) }
