name: Build

on:
  push:
    branches: [ "v2/**", master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Vulnerator_v6.sln

      - name: Build (Release)
        run: msbuild Vulnerator_v6.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerator-${{ github.ref_name == 'master' && 'master' || 'branch' }}-${{ github.sha }}
          path: bin/Release/
          if-no-files-found: error
          retention-days: 30
