name: Build

on:
  push:
    branches: [ "v2/**", master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Verify NIST / CCI reference data
        run: python tools/rev5/verify_reference_data.py .

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Vulnerator_v6.sln

      - name: Build (Release)
        run: msbuild Vulnerator_v6.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      - name: Test checklist import (CKL and CKLB)
        shell: cmd
        timeout-minutes: 5
        # Release builds target x86, so the test host must be 32-bit Windows PowerShell 5.1.
        run: '%SystemRoot%\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-ChecklistImport.ps1 -BinDir bin\Release'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerator-${{ github.ref_name == 'master' && 'master' || 'branch' }}-${{ github.sha }}
          path: bin/Release/
          if-no-files-found: error
          retention-days: 30
