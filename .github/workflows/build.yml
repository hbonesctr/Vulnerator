name: Build

on:
  push:
    # release/<tag> (e.g. release/v7.0.0-beta.1) builds, tests and publishes that release, then removes the branch.
    branches: [ "v2/**", master, "release/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # publish the release on a v* tag
    steps:
      - uses: actions/checkout@v4

      - name: Verify NIST / CCI reference data
        run: python tools/rev5/verify_reference_data.py .

      - name: Compile every SQL statement against the schema
        run: python tools/tests/verify_sql.py .

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Vulnerator_v6.sln

      - name: Build (Release)
        shell: pwsh
        # Compiler errors are re-emitted as annotations so they show on the run page and through the checks API.
        run: |
          $output = & msbuild Vulnerator_v6.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $output | Where-Object { $_ -match ': error ' } | Select-Object -Unique -First 20 | ForEach-Object { Write-Host ('::error::' + ($_ -replace '^.*\\([^\\]+\.cs)', '$1')) }
          exit $code

      - name: Use Windows' SQLite (winsqlite3) in System.Data.SQLite
        shell: powershell
        run: tools/ci/Use-WindowsSqlite.ps1 -BinDir bin/Release

      - name: Launch test (window appears)
        shell: cmd
        timeout-minutes: 5
        # 64-bit Windows PowerShell, like the x64 build, so the follow-up probe can load the program.
        run: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-Launch.ps1 -BinDir bin\Release'

      - name: Turn strong-name bypass off, as DoD .NET hardening does
        shell: powershell
        # AllowStrongNameBypass = 0 (.NET Framework STIG): signed assemblies are validated on every load.
        run: |
          foreach ($key in 'HKLM:\SOFTWARE\Microsoft\.NETFramework', 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\.NETFramework') {
            New-ItemProperty -Path $key -Name AllowStrongNameBypass -PropertyType DWord -Value 0 -Force | Out-Null
          }
          Write-Host '::notice::AllowStrongNameBypass = 0 for the tests'

      - name: Check SQLite comes from Windows; log4net
        shell: pwsh
        # Locked-down machines block native DLLs in user folders: the program folder must carry none for SQLite.
        run: |
          $bin = 'bin/Release'
          $bad = 0
          foreach ($dll in Get-ChildItem $bin -Recurse -Include 'e_sqlite3.dll', 'SQLite.Interop.dll', 'sqlite3.dll', 'System.Data.SQLite.Linq.dll') { Write-Host ('::error::native SQLite file shipped: ' + $dll.FullName); $bad++ }
          $sds = [IO.File]::ReadAllBytes((Resolve-Path "$bin/System.Data.SQLite.dll"))
          if (-not [Text.Encoding]::ASCII.GetString($sds).Contains('winsqlite3')) { Write-Host '::error::System.Data.SQLite.dll does not reference winsqlite3'; $bad++ }
          $win = Get-Item "$env:SystemRoot\System32\winsqlite3.dll"
          Write-Host ('::notice::System.Data.SQLite ' + (Get-Item "$bin/System.Data.SQLite.dll").VersionInfo.ProductVersion + ' -> Windows winsqlite3.dll ' + $win.VersionInfo.ProductVersion + '; log4net ' + (Get-Item "$bin/log4net.dll").VersionInfo.ProductVersion)
          if ((Get-Item "$bin/log4net.dll").VersionInfo.FileVersion -notlike '2.0.17*') { Write-Host '::error::log4net is not 2.0.17'; $bad++ }
          exit $bad

      - name: Test checklist import (CKL and CKLB)
        shell: cmd
        timeout-minutes: 5
        # Release builds target x64, so the test host is 64-bit Windows PowerShell 5.1.
        run: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-ChecklistImport.ps1 -BinDir bin\Release -OutDir sample-exports'

      - name: Test Entity Framework data loading (screens)
        shell: cmd
        timeout-minutes: 5
        run: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-EntityFramework.ps1 -BinDir bin\Release'

      - name: Verify eMASS exports against the templates
        run: |
          python -m pip install --quiet openpyxl
          python tools/tests/verify_emass_exports.py sample-exports/sample-eMASS-POAM.xlsx sample-exports/sample-eMASS-HW-SW-List.xlsx

      - name: Upload sample eMASS exports (synthetic data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-eMASS-exports-${{ github.sha }}
          path: sample-exports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Smoke-test Test-RealData.ps1 on the synthetic files
        shell: cmd
        timeout-minutes: 5
        run: |
          mkdir realdata-smoke
          copy tools\tests\fixtures\multi-stig.ckl realdata-smoke\
          copy tools\tests\fixtures\viewer3.cklb realdata-smoke\
          copy tools\tests\fixtures\scan.nessus realdata-smoke\
          copy tools\tests\fixtures\acas-vulnerability-detail.csv realdata-smoke\
          copy tools\tests\fixtures\xccdf\scc5-results.xml realdata-smoke\
          copy tools\tests\fixtures\stig\U_Library_Test_STIG_V2R4_Manual-xccdf.xml realdata-smoke\
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-RealData.ps1 -InputDir realdata-smoke -BinDir bin\Release -IgApFile tools\tests\fixtures\igap-sample.xlsx

      - name: Add the real-data test script to the build
        run: Copy-Item tools/tests/Test-RealData.ps1 bin/Release/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerator-${{ github.ref_name == 'master' && 'master' || 'branch' }}-${{ github.sha }}
          path: bin/Release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (v* tag or release/v* branch)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}' -replace '^release/', ''
          $zip = "Vulnerator-$tag.zip"
          Get-ChildItem bin/Release -Recurse -Include '*.pdb' | Remove-Item
          Compress-Archive -Path bin/Release/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$zip.sha256" "$hash  $zip" -Encoding ascii
          # Hashes of every program file, for administrators who allow software by hash (application control).
          $hashFile = "Vulnerator-$tag-file-hashes.txt"
          $root = (Resolve-Path bin/Release).Path
          Get-ChildItem bin/Release -Recurse -File | Sort-Object FullName | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.FullName.Substring($root.Length + 1) } | Set-Content $hashFile -Encoding ascii
          $exeHash = (Get-FileHash bin/Release/Vulnerator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesFile = "docs/release-notes/$tag.md"
          $notes = if (Test-Path $notesFile) { Get-Content $notesFile -Raw } else { "Vulnerator $tag" }
          $allow = "`n`n**For application control (allow by hash):** ``Vulnerator.exe`` ``$exeHash``. Vulnerator ships no native DLLs (SQLite comes from Windows); every file's hash is in ``$hashFile``."
          Set-Content notes.md ($notes.TrimEnd() + "`n`n**SHA-256** ``$zip``: ``$hash``" + $allow) -Encoding utf8
          $arguments = @('release', 'create', $tag, $zip, "$zip.sha256", $hashFile, '--title', "Vulnerator $tag", '--notes-file', 'notes.md', '--target', '${{ github.sha }}')
          if ($tag -match '-') { $arguments += '--prerelease' }
          $output = & gh @arguments 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { Write-Host ('::error::release publish failed: ' + ($output -replace "`r?`n", ' ')); exit 1 }
          Write-Host "::notice::Published $tag ($hash)"
          if ('${{ github.ref }}' -like 'refs/heads/release/*') { git push origin --delete '${{ github.ref_name }}' }
