name: Build

on:
  push:
    branches: [ "v2/**", master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # publish the release on a v* tag
    steps:
      - uses: actions/checkout@v4

      - name: Verify NIST / CCI reference data
        run: python tools/rev5/verify_reference_data.py .

      - name: Compile every SQL statement against the schema
        run: python tools/tests/verify_sql.py .

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Vulnerator_v6.sln

      - name: Build (Release)
        shell: pwsh
        # Compiler errors are re-emitted as annotations so they show on the run page and through the checks API.
        run: |
          $output = & msbuild Vulnerator_v6.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $output | Where-Object { $_ -match ': error ' } | Select-Object -Unique -First 20 | ForEach-Object { Write-Host ('::error::' + ($_ -replace '^.*\\([^\\]+\.cs)', '$1')) }
          exit $code

      - name: Check shipped native SQLite and log4net
        shell: pwsh
        # Scanners (ACAS) flag old SQLite builds in the program folder: report what ships and fail on strays.
        run: |
          $bin = 'bin/Release'
          $managed = (Get-Item "$bin/System.Data.SQLite.dll").VersionInfo.ProductVersion
          Write-Host ('::notice::System.Data.SQLite ' + $managed + '; log4net ' + (Get-Item "$bin/log4net.dll").VersionInfo.ProductVersion)
          $bad = 0
          foreach ($dll in Get-ChildItem $bin -Recurse -Include 'SQLite.Interop.dll', 'sqlite3.dll') {
            $version = $dll.VersionInfo.ProductVersion
            Write-Host ('::notice::' + $dll.FullName.Substring((Resolve-Path $bin).Path.Length + 1) + ' ' + $version)
            if ($dll.Name -eq 'sqlite3.dll' -or $version -ne $managed) { Write-Host ('::error::unexpected native SQLite file ' + $dll.Name + ' ' + $version); $bad++ }
          }
          if ((Get-Item "$bin/log4net.dll").VersionInfo.FileVersion -notlike '2.0.17*') { Write-Host '::error::log4net is not 2.0.17'; $bad++ }
          exit $bad

      - name: Test checklist import (CKL and CKLB)
        shell: cmd
        timeout-minutes: 5
        # Release builds target x86, so the test host must be 32-bit Windows PowerShell 5.1.
        run: '%SystemRoot%\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-ChecklistImport.ps1 -BinDir bin\Release -OutDir sample-exports'

      - name: Verify eMASS exports against the templates
        run: |
          python -m pip install --quiet openpyxl
          python tools/tests/verify_emass_exports.py sample-exports/sample-eMASS-POAM.xlsx sample-exports/sample-eMASS-HW-SW-List.xlsx

      - name: Upload sample eMASS exports (synthetic data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-eMASS-exports-${{ github.sha }}
          path: sample-exports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Smoke-test Test-RealData.ps1 on the synthetic files
        shell: cmd
        timeout-minutes: 5
        run: |
          mkdir realdata-smoke
          copy tools\tests\fixtures\multi-stig.ckl realdata-smoke\
          copy tools\tests\fixtures\viewer3.cklb realdata-smoke\
          copy tools\tests\fixtures\scan.nessus realdata-smoke\
          copy tools\tests\fixtures\acas-vulnerability-detail.csv realdata-smoke\
          copy tools\tests\fixtures\xccdf\scc5-results.xml realdata-smoke\
          copy tools\tests\fixtures\stig\U_Library_Test_STIG_V2R4_Manual-xccdf.xml realdata-smoke\
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\tests\Test-RealData.ps1 -InputDir realdata-smoke -BinDir bin\Release -IgApFile tools\tests\fixtures\igap-sample.xlsx

      - name: Add the real-data test script to the build
        run: Copy-Item tools/tests/Test-RealData.ps1 bin/Release/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerator-${{ github.ref_name == 'master' && 'master' || 'branch' }}-${{ github.sha }}
          path: bin/Release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "Vulnerator-$tag.zip"
          Get-ChildItem bin/Release -Recurse -Include '*.pdb' | Remove-Item
          Compress-Archive -Path bin/Release/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$zip.sha256" "$hash  $zip" -Encoding ascii
          $notesFile = "docs/release-notes/$tag.md"
          $notes = if (Test-Path $notesFile) { Get-Content $notesFile -Raw } else { "Vulnerator $tag" }
          Set-Content notes.md ($notes.TrimEnd() + "`n`n**SHA-256** ``$zip``: ``$hash``") -Encoding utf8
          $arguments = @('release', 'create', $tag, $zip, "$zip.sha256", '--title', "Vulnerator $tag", '--notes-file', 'notes.md', '--verify-tag')
          if ($tag -match '-') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::release publish failed'; exit 1 }
          Write-Host "::notice::Published $tag ($hash)"
